<!doctype html>
<html><head><meta charset="utf-8"><title>Luculent Driver Chat</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0f;color:#e5e7eb;font:13px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #27272a;background:#111118}
header .id{flex:1;min-width:0}
#chatName{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:#9ca3af;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block}
button{border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;background:#27272a;color:#e5e7eb}
#kill{background:#dc2626;color:#fff} #kill.resume{background:#16a34a}
#sessions,#sects{padding:8px 12px 0}
#sessions{width:calc(100% - 24px);background:#18181b;color:#e5e7eb;border:1px solid #3f3f46;border-radius:6px;padding:6px;margin:8px 12px 0}
#sects{display:flex;gap:6px}
#sects button{padding:4px 10px;font-weight:500} #sects button.on{background:#4f46e5}
#list{max-height:120px;overflow:auto;padding:6px 12px;border-bottom:1px solid #18181b}
#list .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #18181b}
#list .row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .row button{padding:3px 8px;font-size:11px}
#plan{margin:8px 12px 0;padding:8px;background:#111118;border:1px solid #27272a;border-radius:8px;font-size:12px}
#plan .head{color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
#plan .goal{color:#e5e7eb;text-transform:none;letter-spacing:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plan ol{margin:0;padding:0 0 0 18px}
#plan li{margin:3px 0;color:#d4d4d8}
#plan li.done{color:#86efac}
#plan li.current{color:#c7d2fe;font-weight:600}
#plan li.miss,#plan li.error{color:#fca5a5}
#plan li.pending{color:#9ca3af}
#plan .evt{margin-top:6px;color:#fcd34d;font-size:11px}
#chip{margin:8px 12px 0;padding:6px 8px;background:#1e1b4b;border:1px solid #4f46e5;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:12px}
#chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log{flex:1;overflow:auto;padding:10px 12px}
#log .msg{margin:0 0 10px;line-height:1.45}
#log .msg .who{font-size:11px;color:#9ca3af}
#log .msg.user{ } #log .msg.agent{ } #log .msg.system{color:#9ca3af}
#pause{margin:8px 12px 0;padding:8px;background:#422006;border:1px solid #f59e0b;border-radius:8px}
#pause b{color:#fcd34d}
#composer{border-top:1px solid #27272a;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
#composer textarea{width:100%;box-sizing:border-box;background:#18181b;color:#e5e7eb;border:1px solid #3f3f46;border-radius:8px;padding:8px;font:13px system-ui;resize:vertical;min-height:44px}
#composer .row{display:flex;gap:6px}
#pull{background:#4f46e5;color:#fff;flex:1}
#composer button[type=submit]{flex:0 0 auto}
.empty{color:#6b7280;padding:12px;font-size:12px}
</style></head><body>
<header>
  <div class="id">
    <div id="chatName">No agent connected</div>
    <div id="meta"><span id="provider"></span><span id="model"></span></div>
  </div>
  <span id="st"><span class="dot"></span><span id="stText">offline</span></span>
  <button id="kill">Killswitch</button>
</header>
<div id="pause" hidden></div>
<select id="sessions" aria-label="Chat sessions"></select>
<nav id="sects">
  <button type="button" data-sec="active" class="on">Active</button>
  <button type="button" data-sec="closed">Closed</button>
  <button type="button" data-sec="saved">Saved</button>
</nav>
<div id="list"></div>
<div id="chip" hidden>
  <span id="chipLabel"></span>
  <button type="button" id="chipRefresh">Refresh</button>
  <button type="button" id="chipRemove">Remove</button>
</div>
<div id="plan" hidden>
  <div class="head">Plan <span class="goal" id="planGoal"></span></div>
  <ol id="planSteps"></ol>
  <div class="evt" id="planEvent" hidden></div>
</div>
<div id="log"><div class="empty">When an AI agent drives this browser, you can talk to it here. The header shows the provider, model, and chat name.</div></div>
<form id="composer">
  <div class="row">
    <button type="button" id="pull">Pull page context</button>
    <button type="submit">Send</button>
  </div>
  <textarea id="in" rows="2" placeholder="Message the agent driving this browser"></textarea>
</form>
<script type="module" src="panel.js"></script>
</body></html>
