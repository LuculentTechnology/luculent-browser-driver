<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Luculent Driver Chat</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="workspace.css">
</head>
<body class="panel">
<header class="shell">
  <div class="brand">
    <img class="mark" src="icons/luculent-favicon.svg" width="22" height="22" alt="">
    <div class="id">
      <div id="chatName">No agent connected</div>
      <div id="meta"><span id="provider"></span><span id="model"></span></div>
    </div>
  </div>
  <span id="st"><span class="dot"></span><span id="stText">offline</span></span>
  <button id="kill">Killswitch</button>
</header>
<div id="pause" hidden></div>
<div id="clickRow" class="click-row">
  <label for="clickMode">When you click in the AI's tab</label>
  <select id="clickMode" aria-label="When you click in the AI's tab">
    <option value="cowork">Cowork</option>
    <option value="pause">Pause</option>
    <option value="disable">Disable window</option>
  </select>
</div>
<div id="cowork" class="cowork-note" role="status" aria-live="polite" hidden></div>
<div class="panel-work-area">
<aside class="panel-session-rail" aria-label="Chat sessions">
<select id="sessions" aria-label="Chat sessions"></select>
<nav id="sects">
  <button type="button" data-sec="active" class="on">Active</button>
  <button type="button" data-sec="closed">Closed</button>
  <button type="button" data-sec="saved">Saved</button>
</nav>
<div id="list"></div>
</aside>
<main class="panel-conversation" aria-label="Agent conversation">
<div id="chip" hidden>
  <span id="chipLabel"></span>
  <button type="button" id="chipRefresh">Refresh</button>
  <button type="button" id="chipRemove">Remove</button>
</div>
<div id="plan" hidden>
  <div class="head">Plan <span class="goal" id="planGoal"></span></div>
  <ol id="planSteps"></ol>
  <div class="evt" id="planEvent" hidden></div>
</div>
<div id="log"><div class="empty">When an AI agent drives this browser, you can talk to it here. The header shows the provider, model, and chat name.</div></div>

<section id="navMeta" class="consent-card">
  <div class="consent-head">
    <div>
      <b id="navMetaTitle">Help the driver get much faster over time</b>
      <small id="navMetaCaption"></small>
    </div>
    <label>Share navigation metadata <input type="checkbox" id="navMetaOn"></label>
  </div>
  <p id="navMetaBody" class="consent-copy"></p>
  <a id="navMetaPrivacy" class="policy" href="https://privacy.luculent.dev/policy" target="_blank" rel="noopener">Privacy policy</a>
</section>
<form id="composer">
  <div class="row">
    <button type="button" id="pull">Pull page context</button>
    <button type="submit">Send</button>
  </div>
  <textarea id="in" rows="2" placeholder="Message the agent driving this browser"></textarea>
</form>
</main>
</div>
<script type="module" src="panel.js"></script>
</body></html>
