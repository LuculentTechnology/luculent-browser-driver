name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests (relay, security controls, headless, real extension)
        run: npm test
        env:
          LBD_HOME: ${{ runner.temp }}/lbd-home
      - name: Local broad suite (fixtures only, no live sites)
        run: node harness/broad.mjs --live 0
      - name: Package the extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: extension-zip
          path: dist/*.zip
